# ====================================================================================
#  Blaze's Shadows  -  shaders.properties
# ------------------------------------------------------------------------------------
#  Drives the in-game settings menu (screens, sliders, profiles) and a handful of
#  pipeline behaviours (shadow rendering, blending, dynamic hand light, etc.).
#  Option identifiers here must match the #define names in lib/settings.glsl.
# ====================================================================================

# ------------------------------------------------------------------ Menu layout -----
screen = [PROFILE] <empty> \
         [LIGHTING] [SHADOWS] [AMBIENT_OCCLUSION] [VOLUMETRICS] \
         [SKY] [WEATHER] [WATER] [FOG] \
         [REFLECTIONS] [BLOOM] [POST] [COLOR] \
         [ANTIALIASING] [VEGETATION] [MATERIAL] [DIMENSIONS] \
         [PERFORMANCE]

screen.PROFILE = profile

screen.LIGHTING = SUNLIGHT_INTENSITY MOONLIGHT_INTENSITY AMBIENT_INTENSITY <empty> \
                  BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMPERATURE COLORED_LIGHTING <empty> \
                  HANDHELD_LIGHT HANDHELD_LIGHT_INTENSITY <empty> \
                  GI GI_STRENGTH

screen.SHADOWS = SHADOW_QUALITY SHADOW_DISTANCE <empty> \
                 SHADOW_FILTER SHADOW_SOFTNESS <empty> \
                 CONTACT_HARDENING CONTACT_SHADOWS <empty> \
                 COLORED_SHADOWS

screen.AMBIENT_OCCLUSION = SSAO SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH <empty> \
                           SSGI SSGI_STRENGTH

screen.VOLUMETRICS = VOLUMETRIC_LIGHT VL_SAMPLES VL_INTENSITY <empty> \
                     VOLUMETRIC_FOG VL_FOG_DENSITY

screen.SKY = SKY_BRIGHTNESS SKY_SATURATION <empty> \
             CLOUDS CLOUDS_VOLUMETRIC CLOUD_SAMPLES <empty> \
             CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_THICKNESS <empty> \
             STARS STAR_BRIGHTNESS MILKY_WAY <empty> \
             SHOOTING_STARS AURORA RAINBOW

screen.WEATHER = RAIN_RIPPLES WET_SURFACES

screen.WATER = WATER_WAVES WATER_WAVE_HEIGHT <empty> \
               WATER_REFRACTION WATER_CAUSTICS WATER_FOAM <empty> \
               WATER_FOG_DENSITY <empty> \
               WATER_ABSORPTION_R WATER_ABSORPTION_G WATER_ABSORPTION_B

screen.FOG = ATMOSPHERIC_FOG FOG_DENSITY <empty> \
             CAVE_FOG BORDER_FOG

screen.REFLECTIONS = SSR SSR_STEPS SSR_REFINE <empty> \
                     ROUGH_REFLECTIONS SKY_REFLECTION_FALLBACK

screen.BLOOM = BLOOM BLOOM_INTENSITY BLOOM_RADIUS

screen.POST = TONEMAP_OPERATOR <empty> \
              AUTO_EXPOSURE EXPOSURE_SPEED MANUAL_EXPOSURE <empty> \
              EXPOSURE_MIN EXPOSURE_MAX <empty> \
              VIGNETTE VIGNETTE_STRENGTH <empty> \
              SHARPEN SHARPEN_STRENGTH <empty> \
              CHROMATIC_ABERRATION CA_STRENGTH <empty> \
              MOTION_BLUR MOTION_BLUR_STRENGTH MOTION_BLUR_SAMPLES <empty> \
              FILM_GRAIN FILM_GRAIN_STRENGTH <empty> \
              DOF DOF_STRENGTH

screen.COLOR = BRIGHTNESS CONTRAST <empty> \
               SATURATION VIBRANCE <empty> \
               GAMMA WHITE_BALANCE <empty> \
               TINT_R TINT_G TINT_B

screen.ANTIALIASING = TAA TAA_STRENGTH FXAA

screen.VEGETATION = WAVING_PLANTS WAVING_LEAVES WAVING_VINES <empty> \
                    WAVING_WATER_PLANTS WAVING_WATER <empty> \
                    WIND_STRENGTH WIND_SPEED

screen.MATERIAL = EMISSIVE EMISSIVE_STRENGTH <empty> \
                  NORMAL_MAPS SPECULAR_MAPS <empty> \
                  PARALLAX_DEPTH POM_SAMPLES

screen.DIMENSIONS = NETHER_HEAT_HAZE NETHER_SMOKE <empty> \
                    END_PARTICLES

screen.PERFORMANCE = QUALITY_PRESET <empty> \
                     RENDER_SCALE HALF_RES_VOLUMETRICS

# --------------------------------------------------------------------- Sliders ------
# Options listed here render as drag sliders; the rest are toggles / value-cyclers.
sliders = SUNLIGHT_INTENSITY MOONLIGHT_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY \
          BLOCKLIGHT_TEMPERATURE HANDHELD_LIGHT_INTENSITY GI_STRENGTH \
          SHADOW_QUALITY SHADOW_DISTANCE SHADOW_SOFTNESS \
          SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH SSGI_STRENGTH \
          VL_SAMPLES VL_INTENSITY VL_FOG_DENSITY \
          SKY_BRIGHTNESS SKY_SATURATION CLOUD_SAMPLES CLOUD_COVERAGE CLOUD_HEIGHT \
          CLOUD_THICKNESS STAR_BRIGHTNESS \
          WATER_WAVE_HEIGHT WATER_FOG_DENSITY WATER_ABSORPTION_R WATER_ABSORPTION_G \
          WATER_ABSORPTION_B \
          FOG_DENSITY \
          SSR_STEPS SSR_REFINE \
          BLOOM_INTENSITY BLOOM_RADIUS \
          TONEMAP_OPERATOR EXPOSURE_SPEED MANUAL_EXPOSURE EXPOSURE_MIN EXPOSURE_MAX \
          VIGNETTE_STRENGTH SHARPEN_STRENGTH CA_STRENGTH MOTION_BLUR_STRENGTH \
          MOTION_BLUR_SAMPLES FILM_GRAIN_STRENGTH DOF_STRENGTH \
          BRIGHTNESS CONTRAST SATURATION VIBRANCE GAMMA WHITE_BALANCE TINT_R TINT_G TINT_B \
          TAA_STRENGTH \
          WIND_STRENGTH WIND_SPEED \
          EMISSIVE_STRENGTH PARALLAX_DEPTH POM_SAMPLES \
          QUALITY_PRESET RENDER_SCALE

# --------------------------------------------------------------------- Profiles -----
profile.LOW = SHADOW_QUALITY=0 SHADOW_DISTANCE=80.0 !SHADOW_FILTER !CONTACT_HARDENING \
              !CONTACT_SHADOWS !COLORED_SHADOWS \
              !SSAO !SSGI !VOLUMETRIC_LIGHT !VOLUMETRIC_FOG \
              !CLOUDS_VOLUMETRIC CLOUD_SAMPLES=8 !AURORA !MILKY_WAY !SHOOTING_STARS \
              !WATER_CAUSTICS !WATER_FOAM !RAIN_RIPPLES !WET_SURFACES \
              !SSR !ROUGH_REFLECTIONS \
              !BLOOM !MOTION_BLUR !FILM_GRAIN !CHROMATIC_ABERRATION !DOF \
              !GI QUALITY_PRESET=1 RENDER_SCALE=0.70 SSAO_SAMPLES=4 VL_SAMPLES=6

profile.MEDIUM = SHADOW_QUALITY=1 SHADOW_DISTANCE=120.0 SHADOW_FILTER !CONTACT_HARDENING \
                 !CONTACT_SHADOWS COLORED_SHADOWS \
                 SSAO !SSGI VOLUMETRIC_LIGHT !VOLUMETRIC_FOG \
                 CLOUDS_VOLUMETRIC CLOUD_SAMPLES=12 !AURORA MILKY_WAY !SHOOTING_STARS \
                 WATER_CAUSTICS WATER_FOAM RAIN_RIPPLES WET_SURFACES \
                 SSR !ROUGH_REFLECTIONS \
                 BLOOM !MOTION_BLUR !FILM_GRAIN !DOF \
                 !GI QUALITY_PRESET=2 RENDER_SCALE=0.90 SSAO_SAMPLES=8 VL_SAMPLES=12 \
                 SSR_STEPS=16

profile.HIGH = SHADOW_QUALITY=2 SHADOW_DISTANCE=160.0 SHADOW_FILTER CONTACT_HARDENING \
               CONTACT_SHADOWS COLORED_SHADOWS \
               SSAO SSGI VOLUMETRIC_LIGHT VOLUMETRIC_FOG \
               CLOUDS_VOLUMETRIC CLOUD_SAMPLES=20 AURORA MILKY_WAY SHOOTING_STARS \
               WATER_CAUSTICS WATER_FOAM RAIN_RIPPLES WET_SURFACES \
               SSR ROUGH_REFLECTIONS \
               BLOOM !MOTION_BLUR !FILM_GRAIN !DOF \
               GI QUALITY_PRESET=3 RENDER_SCALE=1.00 SSAO_SAMPLES=12 VL_SAMPLES=16 \
               SSR_STEPS=24

profile.ULTRA = SHADOW_QUALITY=3 SHADOW_DISTANCE=200.0 SHADOW_FILTER CONTACT_HARDENING \
                CONTACT_SHADOWS COLORED_SHADOWS \
                SSAO SSGI VOLUMETRIC_LIGHT VOLUMETRIC_FOG \
                CLOUDS_VOLUMETRIC CLOUD_SAMPLES=28 AURORA MILKY_WAY SHOOTING_STARS \
                WATER_CAUSTICS WATER_FOAM RAIN_RIPPLES WET_SURFACES \
                SSR ROUGH_REFLECTIONS \
                BLOOM MOTION_BLUR !FILM_GRAIN !DOF \
                GI QUALITY_PRESET=4 RENDER_SCALE=1.00 SSAO_SAMPLES=16 VL_SAMPLES=24 \
                SSR_STEPS=32 SSR_REFINE=6

profile.EXTREME = SHADOW_QUALITY=4 SHADOW_DISTANCE=256.0 SHADOW_FILTER CONTACT_HARDENING \
                  CONTACT_SHADOWS COLORED_SHADOWS \
                  SSAO SSGI VOLUMETRIC_LIGHT VOLUMETRIC_FOG \
                  CLOUDS_VOLUMETRIC CLOUD_SAMPLES=40 AURORA MILKY_WAY SHOOTING_STARS \
                  WATER_CAUSTICS WATER_FOAM RAIN_RIPPLES WET_SURFACES \
                  SSR ROUGH_REFLECTIONS \
                  BLOOM MOTION_BLUR FILM_GRAIN DOF \
                  GI QUALITY_PRESET=5 RENDER_SCALE=1.00 SSAO_SAMPLES=32 VL_SAMPLES=32 \
                  SSR_STEPS=48 SSR_REFINE=8

# ---------------------------------------------------------------- Pipeline config ---
# Render shadow casters out to the full shadow distance.
shadowDistanceRenderMul = 1.0

# Dynamic hand-held light (feeds heldBlockLightValue / heldBlockLightValue2).
dynamicHandLight = true
oldHandLight = false
oldLighting = false

# The water program composites its own background, so disable hardware blending
# for that pass (we sample colortex0 and do per-channel absorption ourselves).
blend.gbuffers_water = off

# Sun path tilt for more dramatic, less overhead lighting.
sunPathRotation = -35.0
