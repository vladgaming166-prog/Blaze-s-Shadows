# ====================================================================================
#  Blaze's Shadows  -  block.properties
# ------------------------------------------------------------------------------------
#  Maps Minecraft blocks onto the numeric ids that the shader reads from mc_Entity.x.
#  Names are given both with and without the modern (1.20+) renames so the pack works
#  across 1.16 - 1.21.x. Unknown names are silently ignored by OptiFine / Iris.
# ====================================================================================

# ---- 10001 : small, ground-anchored plants (bend from the base) --------------------
block.10001 = grass short_grass fern dead_bush \
              dandelion poppy blue_orchid allium azure_bluet \
              red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy \
              cornflower lily_of_the_valley wither_rose torchflower \
              oak_sapling spruce_sapling birch_sapling jungle_sapling \
              acacia_sapling dark_oak_sapling mangrove_propagule cherry_sapling \
              sweet_berry_bush pink_petals \
              brown_mushroom red_mushroom crimson_roots warped_roots nether_sprouts \
              hanging_roots spore_blossom

# ---- 10002 : tall two-block plants (bend along their whole height) ------------------
block.10002 = tall_grass large_fern sunflower lilac rose_bush peony \
              big_dripleaf small_dripleaf pitcher_plant \
              sugar_cane

# ---- 10003 : leaves ----------------------------------------------------------------
block.10003 = oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves \
              dark_oak_leaves mangrove_leaves cherry_leaves azalea_leaves \
              flowering_azalea_leaves

# ---- 10004 : vines / climbers ------------------------------------------------------
block.10004 = vine weeping_vines weeping_vines_plant twisting_vines twisting_vines_plant \
              cave_vines cave_vines_plant

# ---- 10005 : underwater plants (slow, deep sway) -----------------------------------
block.10005 = kelp kelp_plant seagrass tall_seagrass

# ---- 10006 : farmland crops (bend from the base) -----------------------------------
block.10006 = wheat carrots potatoes beetroots nether_wart torchflower_crop \
              pitcher_crop melon_stem pumpkin_stem attached_melon_stem attached_pumpkin_stem

# ---- 10008 : water (surface waves) -------------------------------------------------
block.10008 = water flowing_water

# ---- 10050 : fully emissive blocks -------------------------------------------------
block.10050 = lava flowing_lava fire soul_fire glowstone sea_lantern \
              torch wall_torch soul_torch soul_wall_torch redstone_torch redstone_wall_torch \
              lantern soul_lantern shroomlight magma_block jack_o_lantern end_rod \
              campfire soul_campfire beacon conduit \
              ochre_froglight verdant_froglight pearlescent_froglight \
              crying_obsidian respawn_anchor lightning_rod \
              amethyst_cluster large_amethyst_bud

# ---- 10051 : partially emissive (ores / lit blocks) --------------------------------
block.10051 = redstone_lamp redstone_ore deepslate_redstone_ore \
              glow_lichen sculk sculk_vein sculk_catalyst sculk_shrieker \
              small_amethyst_bud medium_amethyst_bud budding_amethyst
